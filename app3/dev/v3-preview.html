let editMode,_ps=null;
function render(){document.body.classList.toggle('dark',S.dark);const p=document.getElementById('phone');
 const _sc=p.querySelector('.scroll'),_st=_sc&&_ps===S.screen?_sc.scrollTop:0;_ps=S.screen;
 p.className='phone '+(S.dark?'dark':'light')+(['remind','settings'].includes(S.screen)?' g':'');
 p.innerHTML={list:vList,detail:vDetail,remind:vRemind,edit:()=>vEdit(editMode),settings:vSettings,paywall:vPaywall,widget:vWidget}[S.screen]()+(S.screen!='edit'&&S.screen!='widget'?'<div class="home"></div>':'');
 const n=p.querySelector('.scroll');if(n)n.scrollTop=_st;document.getElementById('mode').textContent=S.dark?'淺色':'深色';}
function go(s,m){if(s=='edit'){S.lastScreen=S.screen=='edit'?S.lastScreen:S.screen;editMode=m}S.screen=s;S.toast=null;render()}
function toggleMode(){S.dark=!S.dark;render()}
let undoStack=null,tm;
function did(id){const i=items.find(x=>x.id==id);undoStack={id};i.hist.unshift(new Date(NOW));S.toast=`已記錄`;render();clearTimeout(tm);tm=setTimeout(()=>{S.toast=null;render()},5000)}
function undo(){if(undoStack){items.find(x=>x.id==undoStack.id).hist.shift();undoStack=null}S.toast=null;render()}
function setEvery(n){const i=items.find(x=>x.id==S.sel);i.every=n;render()}
function addItem(){const v=(document.getElementById('nameIn').value||'').trim()||'新項目';const id=Math.max(...items.map(x=>x.id))+1;items.push({id,n:v,g:'brush',every:0,hist:[]});S.sel=id;S.screen='list';S.toast=null;render()}
const q=new URLSearchParams(location.search);
if(q.get('mode')=='dark')S.dark=true;if(q.has('shot'))document.body.classList.add('shot');
const s0=q.get('screen');if(s0){if(s0=='edit'||s0=='editnew'){S.screen='edit';S.lastScreen=s0=='edit'?'detail':'list';editMode=s0=='edit'?'edit':undefined}else S.screen=s0}
if(s0=='empty'){items=[];S.screen='list'}
if(q.get('demo')=='toast'){did(4);clearTimeout(tm)}
render();
