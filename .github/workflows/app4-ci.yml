name: app4 mobile CI

on:
  pull_request:
    paths:
      - 'app4/mobile/**'
      - '.github/workflows/app4-ci.yml'

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app4/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app4/mobile/package-lock.json
      - run: npm ci
      - run: npm test --silent
      - name: Audit (high/critical) with allowlist
        run: npx audit-ci --config audit-ci.json
      - name: Expo export iOS JS bundle
        run: npx expo export --platform ios --output-dir /tmp/decibel-meter-ios-export
