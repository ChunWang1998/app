  <h1>身份牽線 — 支援</h1>
  <p>常見問題：</p>
  <ul>
    <li><strong>如何配對？</strong>完成開通並填寫 LINE ID 後，於主頁點「今日配對」。</li>
    <li><strong>配對後怎麼聊？</strong>先在 App 內簡聊（合計最多 20 句）。滿額後雙方選擇是否願意繼續；皆同意才顯示彼此 LINE ID。任一方拒絕則結束聊天，並刪除該次聊天紀錄。</li>
    <li><strong>訂閱與恢復購買</strong>：於 App 內「解鎖 Premium」使用立即訂閱／恢復購買／兌換優惠碼。</li>
    <li><strong>檢舉</strong>：配對結果或紀錄頁可檢舉；我們會於後台查看。</li>
  </ul>
  <p>若需協助，請回覆 App Store 評論或透過開發者聯絡管道告知裝置型號與問題描述。</p>
</body>
